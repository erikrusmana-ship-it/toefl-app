name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Lint, Build and Test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (including dev)
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint > lint.txt 2>&1

      - name: Build Next.js
        run: npm run build > build.txt 2>&1

      - name: TypeScript type check
        run: npx tsc --noEmit > tsc.txt 2>&1

      - name: Run unit tests
        run: npm run test:unit > unit.txt 2>&1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium > playwright_install.txt 2>&1

      - name: Start Next.js production server
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > next.log 2>&1 &
          echo $! > next.pid
          npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Run E2E tests (Playwright)
        run: npm run test:e2e > e2e.txt 2>&1

      - name: Stop Next.js production server
        if: always()
        run: |
          if [ -f next.pid ]; then
            kill "$(cat next.pid)" || true
          fi

      - name: Show collected logs
        if: always()
        run: |
          echo "--- next.log ---"
          cat next.log || true
          echo "--- e2e.txt ---"
          cat e2e.txt || true
          echo "--- playwright_install.txt ---"
          cat playwright_install.txt || true
          echo "--- lint.txt ---"
          cat lint.txt || true
          echo "--- build.txt ---"
          cat build.txt || true
          echo "--- tsc.txt ---"
          cat tsc.txt || true
          echo "--- unit.txt ---"
          cat unit.txt || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            lint.txt
            build.txt
            tsc.txt
            unit.txt
            playwright_install.txt
            e2e.txt
            next.log
            next.pid
