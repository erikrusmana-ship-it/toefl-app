name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Lint, Build and Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint > lint.txt 2>&1 || true

      - name: Build Next.js
        run: npm run build > build.txt 2>&1 || true

      - name: TypeScript type check
        run: npx tsc --noEmit > tsc.txt 2>&1 || true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium > playwright_install.txt 2>&1 || true

      - name: Run E2E tests (Playwright)
        run: node tests/e2e.spec.js > e2e.txt 2>&1 || true

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            lint.txt
            build.txt
            tsc.txt
            playwright_install.txt
            e2e.txt
